<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Key Panel</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container" id="app">
    <div class="sidebar card">
      <div class="brand">Key Panel</div>
      <div style="font-size:12px;color:#bbb">Manage keys, tokens, and settings</div>
      <div class="tabs">
        <button class="navbtn" data-tab="stats">Stats</button>
        <button class="navbtn" data-tab="keys">Keys</button>
        <button class="navbtn" data-tab="tokens">Tokens</button>
        <button class="navbtn" data-tab="settings">Settings</button>
      </div>
      <div style="margin-top:auto">
        <div style="font-size:12px;color:#aaa">Logged in as: <span id="who">guest</span></div>
        <div style="height:8px"></div>
        <button class="btn" id="logoutBtn">Logout</button>
      </div>
    </div>
    <div class="main">
      <div class="topbar">
        <div>
          <div id="viewTitle">Welcome</div>
          <div style="font-size:12px;color:#bbb">API: <span id="apiBase">https://tradeskey-backend.onrender.com/</span></div>
        </div>
        <div>
          <input id="search" class="input" placeholder="Search keys or tokens..." />
        </div>
      </div>
      <div id="content" style="margin-top:12px">
        <!-- Will be populated by client JS -->
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"><div id="toastMsg">Hello</div></div>
  <audio id="notifAudio" src="/notification.mp3" preload="auto"></audio>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.umd.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
