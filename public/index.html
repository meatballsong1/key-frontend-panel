<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>R&J Trades Dashboard</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <!-- Login page -->
  <div id="login-page" class="page">
    <h1>Get Started</h1>
    <input id="token-input" placeholder="Enter your token" />
    <button id="login-btn">Login</button>
    <p id="login-error" class="error"></p>
  </div>

  <!-- Dashboard page -->
  <div id="dashboard-page" class="page hidden">
    <nav>
      <button class="tab-btn" data-tab="stats">Statistics</button>
      <button class="tab-btn" data-tab="keys">Key Management</button>
      <button class="tab-btn" data-tab="tokens">Admin Tokens</button>
      <button id="logout-btn">Logout</button>
    </nav>

    <section id="stats-tab" class="tab-content">
      <h2>Statistics</h2>
      <div id="stats-cards" class="cards"></div>
      <canvas id="stats-chart"></canvas>
    </section>

    <section id="keys-tab" class="tab-content hidden">
      <h2>Key Management</h2>
      <div>
        <select id="new-key-type">
          <option value="weekly">Weekly</option>
          <option value="lifetime">Lifetime</option>
        </select>
        <input id="new-key-amount" type="number" value="5" min="1" />
        <button id="generate-keys-btn">Generate Keys</button>
      </div>
      <div id="keys-table" class="scroll-table"></div>
    </section>

    <section id="tokens-tab" class="tab-content hidden">
      <h2>Admin Tokens</h2>
      <div id="tokens-table" class="scroll-table"></div>
    </section>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="app.js"></script>
</body>
</html>
