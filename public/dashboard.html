<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Key Panel — Dashboard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container fluid" id="app">
    <header class="topnav card">
      <div class="brand">Key Panel</div>
      <nav class="navtabs">
        <button class="navbtn" data-tab="stats">Stats</button>
        <button class="navbtn" data-tab="keys">Keys</button>
        <button class="navbtn" data-tab="tokens">Tokens</button>
        <button class="navbtn" data-tab="settings">Settings</button>
      </nav>
      <div class="navright">
        <div style="display:flex;align-items:center;gap:8px;margin-right:12px">
          <label style="font-size:13px;color:var(--muted);margin-right:6px">Theme</label>
          <select id="themePicker" class="input select" style="width:140px">
            <option value="theme-purple-pink">Purple-Pink</option>
            <option value="theme-pink">Pink</option>
            <option value="theme-purple">Purple</option>
            <option value="theme-blue">Blue</option>
            <option value="theme-dark">Dark</option>
          </select>
        </div>
        <div style="font-size:13px;color:var(--muted);margin-right:12px">API: <span id="apiBase">https://tradeskey-backend.onrender.com/</span></div>
      </div>
    </header>

    <main class="main">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
        <div id="viewTitle" style="font-size:18px;font-weight:700;color:var(--text)">Welcome</div>
        <div style="font-size:13px;color:var(--muted)">Dashboard</div>
      </div>
      <div id="content" class="content-area fade-in" style="margin-top:12px">
        <!-- Will be populated by client JS -->
      </div>
    </main>
  </div>

  <!-- login removed -->

  <div id="toast" class="toast hidden"><div id="toastMsg">Hello</div></div>
  <audio id="notifAudio" src="/notification.mp3" preload="auto"></audio>

  <div id="confirmOverlay" class="confirm-overlay hidden" style="display:none">
    <div class="confirm-box">
      <h4 id="confirmMsg">Are you sure?</h4>
      <div class="confirm-actions">
        <button id="confirmNo" class="confirm-no">NO</button>
        <button id="confirmYes" class="confirm-yes">YES</button>
      </div>
    </div>
  </div>

  <!-- Key details modal -->
  <div id="keyModal" class="modal hidden" style="display:none">
    <div class="modal-box card">
      <h3 id="keyModalTitle">Key Details</h3>
      <pre id="keyModalBody" style="white-space:pre-wrap;color:var(--muted);background:transparent;border-radius:8px;padding:6px"></pre>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px"><button class="btn" id="keyModalClose">Close</button></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.umd.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
