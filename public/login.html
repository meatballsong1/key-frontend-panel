<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Key Panel — Login</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div style="max-width:520px;margin:80px auto;color:#fff">
    <h2>Login</h2>
    <div class="card">
      <label>Token</label>
      <input id="tokenInput" class="input" placeholder="Enter admin token" />
      <div style="height:8px"></div>
      <div style="display:flex;gap:8px">
        <button class="btn" id="loginBtn">Login</button>
        <a class="btn" href="/" style="background:transparent;border:1px solid rgba(255,255,255,0.06);color:#ddd">Home</a>
      </div>
      <div id="loginErr" style="color:#ffb4c6;margin-top:8px"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"><div id="toastMsg">Hello</div></div>
  <audio id="notifAudio" src="/notification.mp3" preload="auto"></audio>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    const API_BASE = 'https://tradeskey-backend.onrender.com/';
    const loginBtn = document.getElementById('loginBtn');
    const tokenInput = document.getElementById('tokenInput');
    const loginErr = document.getElementById('loginErr');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');
    const audio = document.getElementById('notifAudio');

    function showToast(msg, t=3000){ toastMsg.textContent = msg; toast.classList.remove('hidden'); clearTimeout(toast._t); toast._t = setTimeout(()=>toast.classList.add('hidden'), t); }

    const api = axios.create({ baseURL: API_BASE, withCredentials: true });

    loginBtn.addEventListener('click', async ()=>{
      const token = tokenInput.value.trim();
      if(!token){ loginErr.textContent = 'Enter a token'; return; }
      try{
        const res = await api.post('/login', { token });
        // try authenticated request
        try{ await api.get('/keys'); showToast('Login OK'); location.href = '/dashboard'; return; }catch(e){}
        // fallback: if token returned, set cookie and redirect
        if(res.data && res.data.token){ document.cookie = 'auth_token='+encodeURIComponent(res.data.token)+'; path=/; SameSite=Lax'; showToast('Login OK (fallback)'); setTimeout(()=>location.href='/dashboard',500); }
        else loginErr.textContent = 'Invalid token';
      }catch(err){ loginErr.textContent = 'Login failed: API error'; try{ audio.play(); }catch(e){} }
    });

    tokenInput.addEventListener('keydown', e=>{ if(e.key==='Enter') loginBtn.click(); });
  </script>
</body>
</html>
